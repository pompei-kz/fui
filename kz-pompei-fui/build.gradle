plugins {
  id "maven-publish"
  id 'java-library'
  id 'kz-pompei-publication'
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
    }
  }
}

kzPompeiPublication {
  pom {
    name = 'kz-pompei-fui'
    description = 'File User Interface'
    url = 'https://pompei.kz/programs/kz-pompei-fui'
  }

  developers {
    developer {
      id = 'pompei'
      name = 'Evgenij Kolpakov'
      email = 'pompei@mail.ru'
    }
  }

  scm {
    connection = 'scm:git:https://github.com/pompei-kz/fui.git'
    developerConnection = 'scm:git:ssh://git@github.com:pompei-kz/hotconfig.git'
    url = 'https://github.com/pompei-kz/hotconfig'
  }
}
